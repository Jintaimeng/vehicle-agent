[project]
name = "vehicle-agent"
version = "0.1.0"
description = "Fatigue-driving judgement MVP with LangGraph and a lightweight agent harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "neo4j>=5.26,<6",
    "mcp>=2.3,<3",
    "qdrant-client>=1.18,<1.20",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]
vision = [
    "ultralytics>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/vehicle_agent/knowledge/regulations" = "vehicle_agent/knowledge/regulations"
"src/vehicle_agent/knowledge/vision_fixtures" = "vehicle_agent/knowledge/vision_fixtures"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
